<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>MedCore HMS — Login</title>
<meta name="description" content="MedCore Hospital Management System — Secure login for Doctors, Staff and Patients."/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="css/main.css"/>
<style>
  body { min-height:100vh; display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden;
    font-family:'Nunito',sans-serif;
    background: linear-gradient(rgba(3,12,11,0.87), rgba(3,12,11,0.87)), url('images/surgery-bg.jpg') center/cover no-repeat; }
  body.light-theme { background: linear-gradient(rgba(248,250,252,0.85), rgba(248,250,252,0.9)), url('images/surgery-bg.jpg') center/cover no-repeat; }

  /* Animated background */
  .bg-orbs { position:fixed; inset:0; pointer-events:none; z-index:0; }
  .orb {
    position:absolute; border-radius:50%; filter:blur(80px); opacity:0.18;
    animation: floatOrb 8s ease-in-out infinite;
  }
  .orb-1 { width:500px;height:500px; background:#0d9488; top:-100px; left:-100px; animation-delay:0s; }
  .orb-2 { width:400px;height:400px; background:#059669; bottom:-80px; right:-80px; animation-delay:-3s; }
  .orb-3 { width:300px;height:300px; background:#0f766e; top:50%; left:50%; transform:translate(-50%,-50%); animation-delay:-5s; }
  @keyframes floatOrb {
    0%,100% { transform:translate(0,0) scale(1); }
    33% { transform:translate(30px,-30px) scale(1.05); }
    66% { transform:translate(-20px,20px) scale(0.95); }
  }
  .orb-1 { animation-name:floatOrb1; }
  @keyframes floatOrb1 { 0%,100%{transform:translate(0,0);} 50%{transform:translate(40px,40px);} }

  /* Grid overlay */
  .bg-grid {
    position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:linear-gradient(rgba(13,148,136,0.06) 1px,transparent 1px),linear-gradient(90deg,rgba(13,148,136,0.06) 1px,transparent 1px);
    background-size:60px 60px;
  }

  /* Login container */
  .login-wrap { position:relative;z-index:1; width:100%;max-width:480px; padding:24px; animation:slideUp 0.6s ease; }

  .login-header { text-align:center; margin-bottom:32px; }
  .login-logo {
    width:64px;height:64px;
    background:url('images/logo.jpg') center/cover no-repeat;
    border-radius:18px;
    display:inline-flex;align-items:center;justify-content:center;
    font-size:28px;margin-bottom:16px;
    box-shadow:var(--glow);
    animation:glow 3s ease-in-out infinite;
  }
  .login-title { font-size:28px;font-weight:800;color:var(--text); }
  .login-sub { font-size:14px;color:var(--text-2);margin-top:4px; }

  /* Role selector */
  .role-tabs { display:flex;gap:8px;margin-bottom:24px; }
  .role-tab {
    flex:1;padding:10px 8px;border-radius:var(--radius-sm);border:1px solid var(--card-border);
    background:var(--bg-3);color:var(--text-2);cursor:pointer;
    transition:var(--transition);text-align:center;font-size:13px;font-weight:600;
    display:flex;flex-direction:column;align-items:center;gap:6px;
  }
  .role-tab .role-icon { font-size:22px; }
  .role-tab.active { background:rgba(13,148,136,0.2);border-color:#0d9488;color:#2dd4bf; }
  .role-tab:hover:not(.active) { border-color:rgba(13,148,136,0.4);color:var(--text); }

  /* Form card */
  .login-card {
    background:rgba(5,30,27,0.75);border:1px solid rgba(13,148,136,0.2);
    border-radius:var(--radius-lg);padding:32px;backdrop-filter:blur(20px);
    box-shadow:var(--shadow-lg);
  }

  .demo-hint {
    background:rgba(13,148,136,0.1);border:1px solid rgba(13,148,136,0.25);
    border-radius:var(--radius-sm);padding:10px 14px;margin-bottom:20px;
    font-size:12px;color:#2dd4bf;display:flex;gap:8px;align-items:flex-start;
  }

  .login-btn {
    width:100%;padding:13px;font-size:15px;font-weight:700;
    background:linear-gradient(135deg,#0d9488,#0f766e);
    color:#fff;border:none;border-radius:var(--radius-sm);cursor:pointer;
    transition:var(--transition);font-family:inherit;margin-top:8px;
    box-shadow:0 4px 16px rgba(13,148,136,0.45);
    display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .login-btn:hover { box-shadow:0 6px 24px rgba(13,148,136,0.65);transform:translateY(-1px); }
  .login-btn:active { transform:translateY(0); }
  .login-btn:disabled { opacity:0.6;cursor:not-allowed;transform:none; }

  .spinner {
    width:18px;height:18px;border:2px solid rgba(255,255,255,0.3);
    border-top-color:#fff;border-radius:50%;animation:spin 0.8s linear infinite;
  }

  .error-msg {
    background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);
    border-radius:var(--radius-sm);padding:10px 14px;
    color:var(--danger);font-size:13px;margin-bottom:16px;display:none;
  }

  .login-footer { text-align:center;margin-top:24px;font-size:12px;color:var(--text-3); }
  .login-footer a { color:var(--primary-light);text-decoration:none; }
</style>
</head>
<body>
<script>if(localStorage.getItem('theme') === 'light') document.body.classList.add('light-theme');</script>
<div class="bg-orbs"><div class="orb orb-1"></div><div class="orb orb-2"></div><div class="orb orb-3"></div></div>
<div class="bg-grid"></div>

<div class="login-wrap">
  <div class="login-header">
    <div class="login-logo"></div>
    <h1 class="login-title">MedCore HMS</h1>
    <p class="login-sub">Hospital Management System — Secure Portal</p>
  </div>

  <div class="role-tabs" id="roleTabs">
    <button class="role-tab active" id="tabDoctor" onclick="selectRole('doctor')">
      <span class="role-icon">👨‍⚕️</span>Doctor
    </button>
    <button class="role-tab" id="tabStaff" onclick="selectRole('staff')">
      <span class="role-icon">👩‍💼</span>Staff
    </button>
    <button class="role-tab" id="tabPatient" onclick="selectRole('patient')">
      <span class="role-icon">🧑‍🤝‍🧑</span>Patient
    </button>
    <button class="role-tab" id="tabAdmin" onclick="selectRole('admin')">
      <span class="role-icon">🛡️</span>Admin
    </button>
  </div>

  <div class="login-card">
    <div class="demo-hint" id="demoHint">
      <span>💡</span>
      <span id="demoHintText">Demo: <strong>doctor@medcore.in</strong> / <strong>doctor123</strong></span>
    </div>
    <div class="error-msg" id="errorMsg">❌ Invalid credentials. Please try again.</div>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label class="form-label" for="emailInput">Email Address</label>
        <input class="form-control" id="emailInput" type="email" placeholder="Enter your email" autocomplete="email" required/>
      </div>
      <div class="form-group">
        <label class="form-label" for="passInput">Password</label>
        <input class="form-control" id="passInput" type="password" placeholder="Enter your password" autocomplete="current-password" required/>
      </div>
      <button class="login-btn" type="submit" id="loginBtn">
        <span id="loginBtnText">Sign In</span>
      </button>
    </form>
  </div>

  <div class="login-footer">
    MedCore Hospital &copy; 2026 &nbsp;|&nbsp; <a href="#">Privacy Policy</a> &nbsp;|&nbsp; <a href="#">Support</a>
    <br><br><a href="#" onclick="forceReset()" style="color:var(--text-light);text-decoration:underline;">Fix: Reset System Cache</a>
  </div>
</div>

<script src="js/data.js?v=5"></script>
<script>
  function forceReset() {
    localStorage.clear();
    alert('System cache cleared! Page will now reload.');
    window.location.href = 'index.html';
  }
  const demos = {
    admin:   { email:'vishalingle3265@gmail.com',   pass:'vishal123',   hint:'vishalingle3265@gmail.com / vishal123'   },
    doctor:  { email:'doctor@medcore.in',  pass:'doctor123',  hint:'doctor@medcore.in / doctor123'  },
    staff:   { email:'staff@medcore.in',   pass:'staff123',   hint:'staff@medcore.in / staff123'   },
    patient: { email:'patient@medcore.in', pass:'patient123', hint:'patient@medcore.in / patient123' },
  };
  let selectedRole = 'doctor';

  // Check if already logged in
  window.addEventListener('DOMContentLoaded', () => {
    const u = HMS.loadSession();
    if (u) redirectUser(u);
  });

  function selectRole(role) {
    selectedRole = role;
    document.querySelectorAll('.role-tab').forEach(t => t.classList.remove('active'));
    document.getElementById('tab' + role.charAt(0).toUpperCase() + role.slice(1)).classList.add('active');
    
    if (role === 'admin') {
      document.getElementById('demoHintText').innerHTML = '';
      document.getElementById('emailInput').value = '';
      document.getElementById('passInput').value = '';
    } else {
      const d = demos[role];
      document.getElementById('demoHintText').innerHTML = `Demo: <strong>${d.email}</strong> / <strong>${d.pass}</strong>`;
      document.getElementById('emailInput').value = d.email;
      document.getElementById('passInput').value = d.pass;
    }
    document.getElementById('errorMsg').style.display = 'none';
  }

  // Pre-fill demo credentials
  selectRole('doctor');

  function handleLogin(e) {
    e.preventDefault();
    const email = document.getElementById('emailInput').value.trim();
    const pass  = document.getElementById('passInput').value;
    const btn   = document.getElementById('loginBtn');
    const txt   = document.getElementById('loginBtnText');
    const err   = document.getElementById('errorMsg');

    err.style.display = 'none';
    btn.disabled = true;
    txt.innerHTML = '<div class="spinner"></div>';

    setTimeout(() => {
      const user = HMS.login(email, pass);
      btn.disabled = false;
      if (user) {
        txt.textContent = '✓ Redirecting...';
        setTimeout(() => redirectUser(user), 500);
      } else {
        txt.textContent = 'Sign In';
        err.style.display = 'block';
      }
    }, 900);
  }

  function toggleView(view) {} // Removed as signup is disabled
  function handleRegister(e) {} // Removed as signup is disabled

  function redirectUser(user) {
    const map = { admin: 'admin.html', doctor:'doctor.html', staff:'staff.html', patient:'patient.html' };
    window.location.href = map[user.role] || 'index.html';
  }
</script>
</body>
</html>
