<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>MedCore HMS — Patient Portal</title>
<meta name="description" content="Patient portal for MedCore Hospital Management System."/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="css/main.css"/>
<link rel="stylesheet" href="css/patient.css"/>
</head>
<body>
<script>if(localStorage.getItem('theme') === 'light') document.body.classList.add('light-theme');</script>
<div class="app-layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon"></div>
      <div><div class="logo-text">MedCore</div><div class="logo-sub">Patient Portal</div></div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section-label">My Health</div>
      <button class="nav-item active" onclick="showPage('overview')" id="nav-overview"><span class="nav-icon">🏠</span>Overview</button>
      <button class="nav-item" onclick="showPage('appointments')" id="nav-appointments"><span class="nav-icon">📅</span>Appointments</button>
      <button class="nav-item" onclick="showPage('prescriptions')" id="nav-prescriptions"><span class="nav-icon">💊</span>Prescriptions</button>
      <button class="nav-item" onclick="showPage('labs')" id="nav-labs"><span class="nav-icon">🔬</span>Lab Results</button>
      <div class="nav-section-label">Account</div>
      <button class="nav-item" onclick="showPage('bills')" id="nav-bills"><span class="nav-icon">💰</span>My Bills</button>
      <button class="nav-item" onclick="showPage('profile')" id="nav-profile"><span class="nav-icon">👤</span>Profile</button>
    </nav>
    <div class="sidebar-footer">
      <div class="user-card">
        <div class="user-avatar" id="userAvatar">RK</div>
        <div><div class="user-name" id="userName">Rohan Kapoor</div><div class="user-role">Patient</div></div>
      </div>
      <button class="btn btn-secondary btn-sm" style="width:100%;margin-top:8px;" onclick="logout()">🚪 Logout</button>
    </div>
  </aside>

  <div class="main-content">
    <header class="topbar">
      <button class="icon-btn" id="menuBtn" onclick="toggleSidebar()" style="display:none">☰</button>
      <h2 class="topbar-title" id="pageTitle">Overview</h2>
      <div style="flex:1"></div>
      <div class="icon-btn" title="Notifications">🔔<span class="badge">1</span></div>
      <div class="icon-btn" title="Theme" onclick="toggleTheme()">🌙</div>
    </header>
    <div class="page-content animate-fadeIn" id="pageContent"></div>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script src="js/data.js"></script>
<script src="js/patient.js"></script>
</body>
</html>
